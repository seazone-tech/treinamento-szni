<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treinamento SZNI</title>
<style>
:root{
  --primary:#0055FF;
  --sidebar-bg:#FFF;--sidebar-fg:#080E32;--sidebar-active-bg:#193CB8;--sidebar-active-fg:#FFF;--sidebar-hover:#F3F3F5;
  --bg:#FFF;--fg:#080E32;--card:#FFF;--card-fg:#141A3C;--border:#E6E7EA;--muted-fg:#6B6E84;--accent:#F3F3F5;
  --success:#059669;--warn:#B45309;--danger:#E7000B;--danger-bg:#FFE2E2;
  --font:'Helvetica Neue',-apple-system,BlinkMacSystemFont,sans-serif;
  --r-lg:8px;--r-xl:12px;--r-full:9999px;
  --sp:var(--status-p-bg,#F0F0F3);--sf:var(--status-p-fg,#6B6E84);--sb:var(--status-p-bd,#C8CAD4);
  --status-p-bg:#F0F0F3;--status-p-fg:#6B6E84;--status-p-bd:#C8CAD4;
  --status-r-bg:#FEF3C7;--status-r-fg:#B45309;--status-r-bd:#FCD34D;
  --status-c-bg:#D1FAE5;--status-c-fg:#059669;--status-c-bd:#34D399;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#3D7FFF;
  --sidebar-bg:#060C18;--sidebar-fg:#EDF0FA;--sidebar-active-bg:#3D7FFF;--sidebar-hover:#101422;
  --bg:#080D1C;--fg:#EDF0FA;--card:#0E1326;--card-fg:#EDF0FA;--border:#242840;--muted-fg:#8A8FAD;--accent:#131829;
  --danger-bg:#460809;
  --status-p-bg:#181C30;--status-p-fg:#8A8FAD;--status-p-bd:#2D3050;
  --status-r-bg:#3A2200;--status-r-fg:#FCA044;--status-r-bd:#7A5200;
  --status-c-bg:#09241A;--status-c-fg:#34D399;--status-c-bd:#065F46;
}}
:root[data-theme="dark"]{
  --primary:#3D7FFF;
  --sidebar-bg:#060C18;--sidebar-fg:#EDF0FA;--sidebar-active-bg:#3D7FFF;--sidebar-hover:#101422;
  --bg:#080D1C;--fg:#EDF0FA;--card:#0E1326;--card-fg:#EDF0FA;--border:#242840;--muted-fg:#8A8FAD;--accent:#131829;
  --danger-bg:#460809;
  --status-p-bg:#181C30;--status-p-fg:#8A8FAD;--status-p-bd:#2D3050;
  --status-r-bg:#3A2200;--status-r-fg:#FCA044;--status-r-bd:#7A5200;
  --status-c-bg:#09241A;--status-c-fg:#34D399;--status-c-bd:#065F46;
}
:root[data-theme="light"]{
  --primary:#0055FF;
  --sidebar-bg:#FFF;--sidebar-fg:#080E32;--sidebar-active-bg:#193CB8;--sidebar-hover:#F3F3F5;
  --bg:#FFF;--fg:#080E32;--card:#FFF;--card-fg:#141A3C;--border:#E6E7EA;--muted-fg:#6B6E84;--accent:#F3F3F5;
  --danger-bg:#FFE2E2;
  --status-p-bg:#F0F0F3;--status-p-fg:#6B6E84;--status-p-bd:#C8CAD4;
  --status-r-bg:#FEF3C7;--status-r-fg:#B45309;--status-r-bd:#FCD34D;
  --status-c-bg:#D1FAE5;--status-c-fg:#059669;--status-c-bd:#34D399;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--fg);font-size:14px}
.shell{display:flex;height:100%}

/* ─── Sidebar ─── */
.sidebar{width:240px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-logo{padding:16px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-mark{width:28px;height:28px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.02em;flex-shrink:0}
.logo-name{font-size:15px;font-weight:700;color:var(--sidebar-fg);line-height:1.1}
.logo-sub{font-size:10px;font-weight:500;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:1px}
.sidebar-nav::-webkit-scrollbar{width:0}
.nav-section{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg);padding:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-lg);cursor:pointer;color:var(--sidebar-fg);font-size:13px;font-weight:500;transition:background 120ms;text-decoration:none}
.nav-item:hover{background:var(--sidebar-hover)}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-fg)}
.nav-num{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted-fg);min-width:18px;flex-shrink:0}
.nav-item.active .nav-num{color:rgba(255,255,255,.6)}
.nav-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-left:auto;background:var(--status-p-bd);transition:background .2s}
.nav-dot.revisao{background:var(--status-r-bd)}
.nav-dot.concluido{background:var(--status-c-fg)}
.nav-item.active .nav-dot{opacity:.75}

/* ─── Main ─── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ─── Topbar ─── */
.topbar{height:52px;flex-shrink:0;border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);position:sticky;top:0;z-index:10}
.topbar-path{font-size:12px;color:var(--muted-fg);display:flex;align-items:center;gap:6px}
.topbar-path span{color:var(--fg);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px}
.theme-btn{padding:5px 10px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--card);color:var(--muted-fg);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--font);transition:background 120ms}
.theme-btn:hover{background:var(--accent)}
.save-indicator{font-size:11px;font-weight:600;color:var(--success);opacity:0;transition:opacity .3s;display:flex;align-items:center;gap:4px}
.save-indicator.show{opacity:1}

/* ─── Content ─── */
.content{padding:28px;flex:1}
.module-header{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.module-icon{width:42px;height:42px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 4px 14px rgba(0,85,255,.18);flex-shrink:0}
.module-title{font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--fg)}
.module-sub{font-size:12px;color:var(--muted-fg);margin-top:2px}

/* ─── Progress ─── */
.progress-wrap{margin-bottom:22px;padding-left:56px}
.progress-stats{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.prog-badge{font-size:11px;font-weight:700;padding:2px 10px;border-radius:var(--r-full);white-space:nowrap}
.prog-badge.pc{background:var(--status-c-bg);color:var(--status-c-fg)}
.prog-badge.pr{background:var(--status-r-bg);color:var(--status-r-fg)}
.prog-badge.pp{background:var(--status-p-bg);color:var(--status-p-fg)}
.prog-pct{font-size:11px;font-weight:700;color:var(--muted-fg);margin-left:auto;font-variant-numeric:tabular-nums}
.progress-bar-bg{height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.progress-bar-fill{height:100%;border-radius:2px;background:var(--success);transition:width .5s ease;width:0%}

/* ─── Toolbar ─── */
.list-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.list-toolbar-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg)}
.filter-group{display:flex;align-items:center;gap:3px}
.filter-btn{padding:3px 10px;border-radius:var(--r-full);font-size:11px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted-fg);cursor:pointer;font-family:var(--font);transition:all 100ms;white-space:nowrap}
.filter-btn:hover{background:var(--accent);color:var(--fg)}
.filter-btn.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filter-btn.fp.active{background:var(--status-p-fg);border-color:var(--status-p-fg);color:#fff}
.filter-btn.fr.active{background:var(--status-r-fg);border-color:var(--status-r-fg);color:#fff}
.filter-btn.fc.active{background:var(--status-c-fg);border-color:var(--status-c-fg);color:#fff}
.add-theme-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r-lg);font-size:12px;font-weight:700;background:var(--primary);color:#fff;border:none;cursor:pointer;font-family:var(--font);transition:opacity 120ms;white-space:nowrap;flex-shrink:0}
.add-theme-btn:hover{opacity:.85}

/* ─── Cards ─── */
.themes-list{display:flex;flex-direction:column;gap:10px}
.theme-card{border:1px solid var(--border);border-left:3px solid var(--status-p-bd);border-radius:var(--r-xl);background:var(--card);overflow:hidden;scroll-margin-top:68px;transition:box-shadow 150ms,border-left-color 200ms}
.theme-card[data-status="revisao"]{border-left-color:var(--status-r-bd)}
.theme-card[data-status="concluido"]{border-left-color:var(--status-c-bd)}
.theme-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.07)}
.theme-card.dragging{opacity:.4}
.theme-card.drag-over{box-shadow:0 0 0 2px var(--primary)}

.theme-header{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 10px;user-select:none}
.drag-handle{cursor:grab;color:var(--muted-fg);font-size:14px;line-height:1;padding:2px 4px;flex-shrink:0;opacity:.3;transition:opacity .12s}
.drag-handle:active{cursor:grabbing}
.theme-card:hover .drag-handle{opacity:.6}
.theme-num-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--r-full);background:var(--accent);color:var(--muted-fg);font-variant-numeric:tabular-nums;flex-shrink:0;min-width:32px;text-align:center}

/* Status select */
.status-select{-webkit-appearance:none;appearance:none;border:none;border-radius:var(--r-full);padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font);outline:none;transition:background .15s,color .15s;flex-shrink:0;line-height:1.4}
.status-select[data-status="pendente"]{background:var(--status-p-bg);color:var(--status-p-fg)}
.status-select[data-status="revisao"]{background:var(--status-r-bg);color:var(--status-r-fg)}
.status-select[data-status="concluido"]{background:var(--status-c-bg);color:var(--status-c-fg)}

/* Title */
.theme-title-wrap{flex:1;min-width:0;cursor:pointer;user-select:text}
.theme-title{font-size:14px;font-weight:600;color:var(--card-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.theme-title-input{display:none;width:100%;font-size:14px;font-weight:600;font-family:var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--primary);border-radius:6px;padding:3px 8px;outline:none}
.theme-title-wrap.editing .theme-title{display:none}
.theme-title-wrap.editing .theme-title-input{display:block}

.theme-actions{display:flex;align-items:center;gap:3px;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;padding:5px 6px;border-radius:6px;font-size:13px;color:var(--muted-fg);transition:color .12s,background .12s;line-height:1;display:flex;align-items:center}
.icon-btn:hover{background:var(--accent);color:var(--fg)}
.icon-btn.del-btn:hover{background:var(--danger-bg);color:var(--danger)}
.icon-btn.toggle-btn{font-size:10px;transition:color .12s,background .12s,transform .2s}
.theme-card.open>.theme-header .toggle-btn{transform:rotate(180deg)}

/* Card body */
.theme-body{display:none;border-top:1px solid var(--border)}
.theme-card.open>.theme-body{display:block}
.card-content{padding:18px 20px 22px;display:flex;flex-direction:column;gap:18px}
.field-label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-fg);margin-bottom:7px}
.text-box{width:100%;background:var(--accent);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;font-family:var(--font);font-size:13px;line-height:1.7;color:var(--fg);min-height:90px;outline:none;resize:vertical;transition:border-color .15s,background .15s}
.text-box:focus{border-color:var(--primary);background:var(--bg)}
.text-box::placeholder{color:var(--muted-fg)}
.enc-box{border-color:rgba(180,83,9,.3);background:rgba(254,243,199,.35)}
.enc-box:focus{border-color:var(--warn);background:var(--bg)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .enc-box{background:rgba(58,34,0,.4);border-color:rgba(252,160,68,.25)}}
:root[data-theme="dark"] .enc-box{background:rgba(58,34,0,.4);border-color:rgba(252,160,68,.25)}

.links-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.link-item{display:flex;align-items:center;gap:10px;background:var(--accent);border:1px solid var(--border);border-radius:var(--r-lg);padding:9px 13px;transition:background 120ms}
.link-item:hover{background:rgba(0,85,255,.04)}
.link-arrow{color:var(--primary);font-size:13px;flex-shrink:0}
.link-info{flex:1;min-width:0}
.link-name{font-size:13px;font-weight:600;color:var(--primary);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.link-name:hover{text-decoration:underline}
.link-url-text{font-size:11px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-del{background:none;border:none;color:var(--muted-fg);cursor:pointer;padding:3px 5px;border-radius:6px;font-size:12px;line-height:1;transition:color .12s,background .12s}
.link-del:hover{color:var(--danger);background:var(--danger-bg)}
.no-links{font-size:12px;color:var(--muted-fg);font-style:italic;padding:4px 0}
.add-row{display:flex;gap:6px;flex-wrap:wrap}
.input{flex:1;min-width:110px;background:var(--accent);border:1px solid var(--border);border-radius:var(--r-lg);padding:7px 11px;font-family:var(--font);font-size:12px;color:var(--fg);outline:none;transition:border-color .15s,background .15s}
.input:focus{border-color:var(--primary);background:var(--bg)}
.input::placeholder{color:var(--muted-fg)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r-lg);font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer;font-family:var(--font);transition:background 120ms,color 120ms;white-space:nowrap;flex-shrink:0}
.btn-p{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-p:hover{opacity:.85}
.btn:not(.btn-p):hover{background:var(--accent)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:24px;max-width:360px;width:90%;box-shadow:0 16px 40px rgba(0,0,0,.18)}
.modal-title{font-size:15px;font-weight:700;color:var(--fg);margin-bottom:8px}
.modal-msg{font-size:13px;color:var(--muted-fg);line-height:1.5;margin-bottom:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

@media(max-width:640px){
  .sidebar{display:none}
  .content{padding:16px}
  .topbar{padding:0 16px}
  .progress-wrap{padding-left:0}
  .filter-group{display:none}
}
</style>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">SZ</div>
      <div>
        <div class="logo-name">Seazone</div>
        <div class="logo-sub">Treinamento SZNI</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Índice de Temas</div>
      <div id="nav-list"></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-path">
        SZNI <span style="color:var(--muted-fg)">›</span> <span>Treinamento de Processos</span>
      </div>
      <div class="topbar-right">
        <div class="save-indicator" id="save-ind">✓ Salvo</div>
        <button class="theme-btn" onclick="cycleTheme()">◑ Tema</button>
      </div>
    </div>

    <div class="content">
      <div class="module-header">
        <div class="module-icon">📋</div>
        <div>
          <div class="module-title">Central de Treinamento</div>
          <div class="module-sub">SZNI — Treinamento de Processos</div>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-stats" id="progress-stats"></div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
      </div>

      <div class="list-toolbar">
        <div class="toolbar-left">
          <span class="list-toolbar-label">Temas</span>
          <div class="filter-group">
            <button class="filter-btn active" onclick="setFilter('all',this)">Todos</button>
            <button class="filter-btn fp" onclick="setFilter('pendente',this)">Pendente</button>
            <button class="filter-btn fr" onclick="setFilter('revisao',this)">Em Revisão</button>
            <button class="filter-btn fc" onclick="setFilter('concluido',this)">Concluído</button>
          </div>
        </div>
        <button class="add-theme-btn" onclick="addTheme()">+ Novo tema</button>
      </div>

      <div class="themes-list" id="themes-container"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="del-modal">
  <div class="modal">
    <div class="modal-title">Excluir tema?</div>
    <div class="modal-msg" id="del-modal-msg">Todo o conteúdo deste tema será removido permanentemente.</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeDelModal()">Cancelar</button>
      <button class="btn btn-p" style="background:var(--danger);border-color:var(--danger)" onclick="confirmDelete()">Excluir</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'szni_training_v1';
const THEMES_KEY  = 'szni_themes_v2';

const DEFAULT_THEMES = [
  {id:'portal-sienge',     num:'01',title:'Portal do Cliente Sienge',                   status:'pendente'},
  {id:'painel-investidor', num:'02',title:'Painel do Investidor',                        status:'pendente'},
  {id:'entrega-spots',     num:'03',title:'Entrega de Spots',                            status:'pendente'},
  {id:'parceria-csi-pmo',  num:'04',title:'Parceria CSI & PMO',                          status:'pendente'},
  {id:'onboarding-csi',    num:'05',title:'Onboarding CSI com Investidor',               status:'pendente'},
  {id:'cadastro-invest',   num:'06',title:'Cadastro de Investidores',                    status:'pendente'},
  {id:'areas-szni',        num:'07',title:'Áreas da SZNI e Direcionamento de Suportes',  status:'pendente'},
  {id:'canal-suportes',    num:'08',title:'Novo Canal de Suportes Unificado',            status:'pendente'},
  {id:'financeiro',        num:'09',title:'Financeiro — Boleto e Inadimplência',         status:'pendente'},
  {id:'csi-questiona',     num:'10',title:'CSI Questiona',                               status:'pendente'},
  {id:'faq',               num:'11',title:'FAQ',                                         status:'pendente'},
  {id:'ata-treinamento-1', num:'12',title:'ATA e Transcrição — Treinamento 1',           status:'pendente'},
];

let THEMES = [];
let pendingDeleteId = null;
let activeFilter = 'all';
let openCards = null; // null = primeira carga (abre o 1º); Set após isso

/* ── Storage ── */
function loadThemes() {
  try {
    const saved = JSON.parse(localStorage.getItem(THEMES_KEY));
    if (Array.isArray(saved) && saved.length)
      return saved.map(t => ({...t, status: t.status || 'pendente'}));
    // migrate from v1
    const old = JSON.parse(localStorage.getItem('szni_themes_v1'));
    if (Array.isArray(old) && old.length)
      return old.map(t => ({...t, status: 'pendente'}));
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_THEMES));
}

function saveThemes() {
  try { localStorage.setItem(THEMES_KEY, JSON.stringify(THEMES)); } catch(e) {}
}

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); showSaveInd(); } catch(e) {}
}

let saveTimer2;
function showSaveInd() {
  const el = document.getElementById('save-ind');
  el.classList.add('show');
  clearTimeout(saveTimer2);
  saveTimer2 = setTimeout(() => el.classList.remove('show'), 2000);
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renumber() {
  THEMES.forEach((t, i) => { t.num = String(i + 1).padStart(2, '0'); });
}

/* ── Progress ── */
function updateProgress() {
  const total = THEMES.length;
  const c = THEMES.filter(t => t.status === 'concluido').length;
  const r = THEMES.filter(t => t.status === 'revisao').length;
  const p = total - c - r;
  const pct = total ? Math.round((c / total) * 100) : 0;
  document.getElementById('progress-stats').innerHTML =
    `<span class="prog-badge pc">✓ ${c} concluído${c!==1?'s':''}</span>` +
    `<span class="prog-badge pr">⟳ ${r} em revisão</span>` +
    `<span class="prog-badge pp">○ ${p} pendente${p!==1?'s':''}</span>` +
    `<span class="prog-pct">${pct}%</span>`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

/* ── Filter ── */
function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('.theme-card').forEach(card => {
    const s = card.dataset.status || 'pendente';
    card.hidden = activeFilter !== 'all' && s !== activeFilter;
  });
}

/* ── Rebuild ── */
function rebuild() {
  renumber();
  saveThemes();
  const data = loadData();
  buildNav(data);
  buildCards(data);
  updateProgress();
}

/* ── Nav ── */
function buildNav(data) {
  const nav = document.getElementById('nav-list');
  nav.innerHTML = '';
  THEMES.forEach(t => {
    const s = t.status || 'pendente';
    const el = document.createElement('a');
    el.className = 'nav-item';
    el.dataset.id = t.id;
    el.href = '#' + t.id;
    el.innerHTML =
      `<span class="nav-num">${t.num}</span>` +
      `<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(t.title)}</span>` +
      `<span class="nav-dot ${s}"></span>`;
    el.addEventListener('click', e => {
      e.preventDefault();
      openCard(t.id);
      document.getElementById(t.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setActiveNav(t.id);
    });
    nav.appendChild(el);
  });
}

function setActiveNav(id) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
}

function updateNavTitle(id, title) {
  const el = document.querySelector(`.nav-item[data-id="${id}"] span:nth-child(2)`);
  if (el) el.textContent = title;
}

function updateNavDot(id, status) {
  const dot = document.querySelector(`.nav-item[data-id="${id}"] .nav-dot`);
  if (dot) dot.className = 'nav-dot ' + status;
}

/* ── Cards ── */
function buildCards(data) {
  // captura quais cards estão abertos antes de destruir o DOM
  if (openCards !== null) {
    document.querySelectorAll('.theme-card.open').forEach(c => openCards.add(c.id));
  }

  const container = document.getElementById('themes-container');
  container.innerHTML = '';
  THEMES.forEach((t, idx) => {
    const td = data[t.id] || { text: '', encaminhamento: '', links: [] };
    const status = t.status || 'pendente';

    // primeira carga: abre só o 1º; depois restaura o que estava aberto
    const shouldOpen = openCards === null ? idx === 0 : openCards.has(t.id);

    const card = document.createElement('div');
    card.className = 'theme-card' + (shouldOpen ? ' open' : '');
    card.id = t.id;
    card.dataset.status = status;
    card.draggable = true;

    card.innerHTML = `
      <div class="theme-header">
        <span class="drag-handle" title="Arrastar para reordenar">⠿</span>
        <span class="theme-num-pill">${t.num}</span>
        <div class="theme-title-wrap" title="Clique para renomear">
          <span class="theme-title">${escHtml(t.title)}</span>
          <input class="theme-title-input" type="text" value="${escHtml(t.title)}" maxlength="120">
        </div>
        <select class="status-select" data-status="${status}" onchange="setStatus('${t.id}',this)" title="Status do tema">
          <option value="pendente" ${status==='pendente'?'selected':''}>○ Pendente</option>
          <option value="revisao"  ${status==='revisao' ?'selected':''}>⟳ Em Revisão</option>
          <option value="concluido"${status==='concluido'?'selected':''}>✓ Concluído</option>
        </select>
        <div class="theme-actions">
          <button class="icon-btn del-btn" title="Excluir tema" onclick="askDelete('${t.id}')">✕</button>
          <button class="icon-btn toggle-btn" title="Expandir / recolher" onclick="toggleCard('${t.id}')">▾</button>
        </div>
      </div>
      <div class="theme-body">
        <div class="card-content">
          <div>
            <div class="field-label">Conteúdo</div>
            <textarea class="text-box" id="text-${t.id}" placeholder="Descreva os conceitos, etapas, responsáveis e observações deste tema..." rows="5">${escHtml(td.text||'')}</textarea>
          </div>
          <div>
            <div class="field-label" style="color:var(--warn)">Encaminhamento</div>
            <textarea class="text-box enc-box" id="enc-${t.id}" placeholder="Registre encaminhamentos, ações e responsáveis definidos no treinamento..." rows="3">${escHtml(td.encaminhamento||'')}</textarea>
          </div>
          <div>
            <div class="field-label">Links e Recursos</div>
            <div class="links-list" id="links-${t.id}">${renderLinks(td.links||[], t.id)}</div>
            <div class="add-row">
              <input class="input" id="link-label-${t.id}" type="text" placeholder="Nome do link">
              <input class="input" id="link-url-${t.id}" type="url" placeholder="https://...">
              <button class="btn btn-p" onclick="addLink('${t.id}')">+ Adicionar</button>
            </div>
          </div>
        </div>
      </div>
    `;
    container.appendChild(card);

    const wrap  = card.querySelector('.theme-title-wrap');
    const label = card.querySelector('.theme-title');
    const input = card.querySelector('.theme-title-input');
    wrap.addEventListener('click', e => {
      if (e.target === input) return;
      wrap.classList.add('editing');
      input.focus(); input.select();
    });
    input.addEventListener('blur', () => commitRename(t.id, input, label, wrap));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { input.value = t.title; input.blur(); }
    });

    let saveTimer;
    const onInput = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => persistTheme(t.id), 700); };
    document.getElementById(`text-${t.id}`).addEventListener('input', onInput);
    document.getElementById(`enc-${t.id}`).addEventListener('input', onInput);
    document.getElementById(`link-url-${t.id}`).addEventListener('keydown', e => { if (e.key === 'Enter') addLink(t.id); });
  });

  // após primeira carga, inicializa o Set para as próximas
  if (openCards === null) {
    openCards = new Set(THEMES.slice(0,1).map(t => t.id));
  }

  if (THEMES.length) setActiveNav(THEMES[0].id);
  applyFilter();
  setupDragDrop();
  setupScrollSpy();
}

/* ── Status ── */
function setStatus(id, sel) {
  const theme = THEMES.find(t => t.id === id);
  if (!theme) return;
  theme.status = sel.value;
  sel.dataset.status = sel.value;
  const card = document.getElementById(id);
  if (card) card.dataset.status = sel.value;
  saveThemes();
  showSaveInd();
  updateNavDot(id, sel.value);
  updateProgress();
  applyFilter();
}

/* ── Rename ── */
function commitRename(id, input, label, wrap) {
  wrap.classList.remove('editing');
  const newTitle = input.value.trim();
  if (!newTitle) { input.value = THEMES.find(t => t.id === id)?.title || ''; return; }
  const theme = THEMES.find(t => t.id === id);
  if (theme) {
    theme.title = newTitle;
    label.textContent = newTitle;
    input.value = newTitle;
    saveThemes();
    updateNavTitle(id, newTitle);
    showSaveInd();
  }
}

/* ── Add / Delete ── */
function addTheme() {
  const id = 'tema-' + Date.now();
  THEMES.push({ id, num: '', title: 'Novo Tema', status: 'pendente' });
  rebuild();
  setTimeout(() => {
    const card = document.getElementById(id);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.querySelector('.theme-title-wrap')?.click();
  }, 80);
}

function askDelete(id) {
  pendingDeleteId = id;
  const theme = THEMES.find(t => t.id === id);
  document.getElementById('del-modal-msg').textContent =
    `"${theme?.title || id}" e todo seu conteúdo serão removidos permanentemente.`;
  document.getElementById('del-modal').classList.add('show');
}

function closeDelModal() {
  document.getElementById('del-modal').classList.remove('show');
  pendingDeleteId = null;
}

function confirmDelete() {
  if (!pendingDeleteId) return;
  const id = pendingDeleteId;
  THEMES = THEMES.filter(t => t.id !== id);
  const data = loadData();
  delete data[id];
  saveData(data);
  closeDelModal();
  rebuild();
}

document.getElementById('del-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeDelModal();
});

/* ── Interactions ── */
function openCard(id) {
  document.getElementById(id)?.classList.add('open');
  openCards?.add(id);
}

function toggleCard(id) {
  const card = document.getElementById(id);
  if (!card) return;
  card.classList.toggle('open');
  if (card.classList.contains('open')) {
    openCards?.add(id);
    setActiveNav(id);
  } else {
    openCards?.delete(id);
  }
}

function persistTheme(id) {
  const data = loadData();
  if (!data[id]) data[id] = { text: '', encaminhamento: '', links: [] };
  data[id].text = document.getElementById(`text-${id}`)?.value || '';
  data[id].encaminhamento = document.getElementById(`enc-${id}`)?.value || '';
  saveData(data);
}

/* ── Links ── */
function renderLinks(links, id) {
  if (!links?.length) return `<div class="no-links">Nenhum link adicionado.</div>`;
  return links.map((l, i) => `
    <div class="link-item">
      <span class="link-arrow">↗</span>
      <div class="link-info">
        <a class="link-name" href="${escHtml(l.url)}" target="_blank" rel="noopener">${escHtml(l.label||l.url)}</a>
        <div class="link-url-text">${escHtml(l.url)}</div>
      </div>
      <button class="link-del" onclick="removeLink('${id}',${i})" title="Remover">✕</button>
    </div>`).join('');
}

function addLink(id) {
  const lLabel = document.getElementById(`link-label-${id}`);
  const lUrl   = document.getElementById(`link-url-${id}`);
  const label = lLabel.value.trim(), url = lUrl.value.trim();
  if (!url) { lUrl.focus(); return; }
  const data = loadData();
  if (!data[id]) data[id] = { text: '', encaminhamento: '', links: [] };
  if (!data[id].links) data[id].links = [];
  data[id].links.push({ label: label || url, url });
  saveData(data);
  lLabel.value = ''; lUrl.value = '';
  document.getElementById(`links-${id}`).innerHTML = renderLinks(data[id].links, id);
}

function removeLink(id, index) {
  const data = loadData();
  if (!data[id]?.links) return;
  data[id].links.splice(index, 1);
  saveData(data);
  document.getElementById(`links-${id}`).innerHTML = renderLinks(data[id].links, id);
}

/* ── Drag & Drop ── */
let dragSrcId = null;
function setupDragDrop() {
  document.querySelectorAll('.theme-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      dragSrcId = card.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (card.id !== dragSrcId) {
        document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('drag-over'));
        card.classList.add('drag-over');
      }
    });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', e => {
      e.preventDefault();
      if (!dragSrcId || card.id === dragSrcId) return;
      const fromIdx = THEMES.findIndex(t => t.id === dragSrcId);
      const toIdx   = THEMES.findIndex(t => t.id === card.id);
      if (fromIdx === -1 || toIdx === -1) return;
      const [moved] = THEMES.splice(fromIdx, 1);
      THEMES.splice(toIdx, 0, moved);
      rebuild();
    });
    card.querySelectorAll('textarea, input, select').forEach(el => {
      el.addEventListener('mousedown', e => e.stopPropagation());
    });
    const handle = card.querySelector('.drag-handle');
    if (handle) {
      handle.addEventListener('mousedown', () => { card.draggable = true; });
      card.addEventListener('mouseup', () => { card.draggable = false; setTimeout(() => { card.draggable = true; }, 0); });
    }
  });
}

/* ── Theme toggle ── */
function cycleTheme() {
  const r = document.documentElement;
  const cur = r.getAttribute('data-theme') || 'system';
  const next = cur === 'system' ? 'dark' : cur === 'dark' ? 'light' : 'system';
  if (next === 'system') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', next);
  try { localStorage.setItem('szni_theme', next); } catch(e) {}
}

/* ── Scroll spy ── */
function setupScrollSpy() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) setActiveNav(e.target.id); });
  }, { threshold: 0.2, rootMargin: '-52px 0px 0px 0px' });
  THEMES.forEach(t => { const el = document.getElementById(t.id); if (el) obs.observe(el); });
}

/* ── Init ── */
(function init() {
  try {
    const saved = localStorage.getItem('szni_theme');
    if (saved && saved !== 'system') document.documentElement.setAttribute('data-theme', saved);
  } catch(e) {}
  THEMES = loadThemes();
  rebuild();
})();
</script>
